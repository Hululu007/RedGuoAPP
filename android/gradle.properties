org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=true
# 依赖解析走不通时快速失败，别在 google() 上挂死重试
systemProp.org.gradle.internal.http.connectionTimeout=8000
systemProp.org.gradle.internal.http.socketTimeout=20000
systemProp.org.gradle.internal.repository.max.retries=0

# Flutter 会给每个 ABI 拆分包加 versionCode 偏移（+1000 × ABI序号），
# 让清单里的内部版本号与设备上读到的值对不上，这里关掉。
force-version-code-ignoring-abi=true
