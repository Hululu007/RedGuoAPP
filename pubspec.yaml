name: duanju_app
description: 独立运行的多端短剧应用
publish_to: none
version: 2.0.3+115

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  video_player: ^2.9.2
  ffi: ^2.2.0
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: ^1.0.7
  path: ^1.9.1
  path_provider: ^2.1.5
  path_provider_platform_interface: ^2.1.3
  path_provider_windows: ^2.3.0
  shared_preferences: ^2.5.5
  shared_preferences_platform_interface: ^2.4.2
  shared_preferences_windows:
    path: packages/shared_preferences_windows
  flutter_foreground_task: 11.0.3
  ffmpeg_kit_flutter_new_min_gpl: 2.6.7
  file_picker: 13.1.0
  crypto: ^3.0.7
  window_manager: ^0.5.1
  package_info_plus: ^10.2.1
  dynamic_color: ^2.1.0
  url_launcher: ^6.3.3
  lpinyin: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # 官方 video_player_android 构建 ExoPlayer 时没开解码器回退，电视盒子
  # 硬解 HEVC 失败会直接报 MediaCodecVideoRenderer error。这里用本地副本
  # 打开 setEnableDecoderFallback(true)，失败时自动转系统软解。
  video_player_android:
    path: third_party/video_player_android
  media_kit_libs_windows_video:
    path: packages/media_kit_libs_windows_video
  media_kit_video:
    path: packages/media_kit_video
  # path_provider_android 2.3.x 的 JNI 实现在 release 模式下触发
  # ClassNotFoundException（flutter/flutter#184750），锁定 2.2.x 规避。
  path_provider_android: 2.2.23
  # shared_preferences_android 2.5.x 同样改用 JNI 实现，锁定最后的纯
  # platform channel 版本规避同类问题。
  shared_preferences_android: 2.4.28
  shared_preferences_windows:
    path: packages/shared_preferences_windows

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/danmaku_emoji/
