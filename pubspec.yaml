name: duanju_app
description: Android 短剧应用
publish_to: none
version: 2.0.16+2026112113

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ffi: ^2.2.0
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  file_picker: 13.1.0
  crypto: ^3.0.7
  package_info_plus: ^10.2.1
  dynamic_color: ^2.1.0
  url_launcher: ^6.3.3
  lpinyin: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # path_provider_android 2.3.x 的 JNI 实现在 release 模式下触发
  # ClassNotFoundException（flutter/flutter#184750），锁定 2.2.x 规避。
  path_provider_android: 2.2.23
  # shared_preferences_android 2.5.x 同样改用 JNI 实现，锁定最后的纯
  # platform channel 版本规避同类问题。
  shared_preferences_android: 2.4.28

flutter:
  uses-material-design: true
